name: Node.js Package

on:
  push:
    branches:
      - to-do-react

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Use the Upload Artifact GitHub Action
        uses: actions/upload-artifact@v4
        with:
          path: dist

